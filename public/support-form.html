<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ABACUS Support Intake</title></head>
<body>
<!-- Static form declaration for hosted form detection. The React Support page submits to this path. -->
<form name="abacus-support" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data">
<input type="hidden" name="form-name" value="abacus-support">
<input name="bot-field" type="text">
<input name="credit_union" type="text">
<input name="user_id" type="text">
<input name="username" type="text">
<input name="email" type="email">
<input name="section" type="text">
<textarea name="problem_description"></textarea>
<input name="submitted_at" type="text">
<input name="screenshot" type="file" accept="image/png,image/jpeg,image/webp">
<button type="submit">Submit</button>
</form>
</body></html>
